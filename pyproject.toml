[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "silentparams"
version = "0.1.0"
description = "Find HTTP APIs that silently ignore misspelled query parameters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
silentparams = "silentparams.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
